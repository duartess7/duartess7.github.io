<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Windows 95 Portfolio — duartess7</title>
  <meta name="description" content="Portfólio interativo de duartess7 inspirado no Windows 95.">
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="overrides.css?v=2">
</head>
<body>
<main id="desktop" aria-label="Área de trabalho do portfólio">
  <h1 class="sr-only">Windows 95 Portfolio de duartess7</h1>
  <section id="desktop-icons" aria-label="Atalhos"></section>
  <section id="windows"></section>
  <button id="notification"><span><img src="assets/start.png" alt=""> Notification</span><b>Welcome to duartess7&apos;s Windows 95 Portfolio! 🎉</b><small>Double-click the icons and explore my work...</small></button>
  <aside id="clippy"><button class="clippy-close" aria-label="Fechar">×</button><div class="clippy-bubble">Welcome! Double-click an icon to explore my portfolio.</div><button class="clippy-image" aria-label="Outra dica"><img src="assets/clippy.gif" alt="Clippy"></button></aside>
  <footer id="taskbar">
    <button id="start-button"><img src="assets/start.png" alt=""><b>Start</b></button>
    <nav id="start-menu" hidden><div class="start-rail">Windows <b>95</b></div><div class="start-items"></div></nav>
    <div id="tasks"></div>
    <div id="tray"><img src="assets/display.png" alt=""><img src="assets/speaker.png" alt=""><time id="clock"></time></div>
  </footer>
  <div id="shutdown-modal" class="modal" hidden><section class="shutdown"><header>Shut Down Windows <button data-close-modal>×</button></header><div class="shutdown-copy"><img src="assets/shutdown.png" alt=""><p>Are you sure you want to shut down the computer?</p></div><footer><button id="power-off">Yes</button><button data-close-modal>No</button></footer></section></div>
  <div id="power-screen" hidden><h2>It&apos;s now safe to turn off your computer.</h2><button>Turn on</button></div>
</main>
<script src="script.js?v=2"></script>
</body>
</html>
